name: Node checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run migrations:eol
      - run: npm test
      - run: npm run check
      - run: npm run check:migrations
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
  database:
    name: PostgreSQL isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vsph_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/vsph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: PostgreSQL integration tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee database-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-log
          path: database-tests.log
          retention-days: 7
      - name: Supabase security advisors on isolated fixture database
        run: npx --yes --package=supabase@2.122.0 --package=@supabase/cli-linux-x64@2.122.0 supabase db advisors --db-url "$TEST_DATABASE_URL?sslmode=disable" --type security --level warn --fail-on error --output-format json
      - name: Rehearse backup and restore in isolated CI service
        run: npm run test:restore:ci
        env:
          VSPH_RESTORE_REHEARSAL: 'true'
          VSPH_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Verify disposable native database helper
        run: npm run test:db:local
  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vsph_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROJECT_E2E_DATABASE: 'true'
      TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/vsph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify disposable authenticated browser helper
        run: npm run test:e2e:db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Development dependency high-severity gate
        run: npm audit --audit-level=high
