<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00255A"><title>Sign in | VSPH Control Center</title><link rel="stylesheet" href="/auth.css"></head>
<body class="auth-page">
<canvas id="authDots" class="auth-dots" aria-hidden="true"></canvas><div class="auth-shade" aria-hidden="true"></div>
<div class="auth-layout">
<header class="auth-header"><a class="brand-text" href="/" aria-label="VSPH Control Center">VSPH</a></header>
<main class="auth-main">
<section class="auth-intro" aria-label="About VSPH"><div class="intro-kicker"><span class="intro-rule"></span>ENTERPRISE SOFTWARE</div><h1>Building<br>What's Next<span class="brand-period">.</span></h1><p>Enterprise Software Solutions for a Smarter Tomorrow.</p><div class="pixel-progress" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></section>
<section class="auth-card" aria-labelledby="loginHeading">
<div class="card-kicker"><span class="card-arrow" aria-hidden="true">↗</span>VSPH CONTROL CENTER</div>
<h2 id="loginHeading">Welcome back</h2><p class="form-description">Sign in to access your organization’s applications.</p>
<form id="loginForm" class="auth-form">
<label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" placeholder="name@company.com" required autofocus>
<label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="reveal" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button></div>
<p id="message" class="form-error" role="alert" aria-live="polite" hidden></p>
<button id="loginButton" class="auth-submit" type="submit"><span class="submit-label">Sign in to workspace</span><span aria-hidden="true">→</span></button>
</form><div class="card-foot safe-access">Access is managed by your organization.</div>
</section></main>
<footer class="auth-footer"><span>© 2026 VSPH. All rights reserved.</span></footer>
</div><script defer src="/auth-background.js"></script><script defer src="/app.js"></script></body></html>
