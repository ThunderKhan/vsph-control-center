<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00255A"><title>Sign in | VSPH Control Center</title><link rel="stylesheet" href="/auth.css"></head>
<body class="auth-page portal-auth">
<canvas id="authDots" class="auth-dots" aria-hidden="true"></canvas><div class="auth-shade" aria-hidden="true"></div>
<div class="auth-layout">
<header class="auth-header"><a class="brand-text" href="/" aria-label="VSPH Control Center">VSPH</a></header>
<main class="auth-main">
<section class="auth-intro" aria-label="About VSPH"><div class="intro-kicker">ENTERPRISE SOFTWARE</div><h1>Building<br>What's Next<span class="brand-period">.</span></h1><p>Enterprise Software Solutions for a Smarter Tomorrow.</p></section>
<section class="auth-card" aria-labelledby="loginHeading">
<div class="card-kicker">VSPH CONTROL CENTER</div>
<h2 id="loginHeading">Welcome back</h2><p class="form-description">Sign in to access your organization’s applications.</p>
<form id="loginForm" class="auth-form">
<label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" placeholder="name@company.com" required autofocus>
<label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="reveal" data-password-toggle="password" aria-label="Show password" aria-controls="password" aria-pressed="false"><svg data-icon="show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg data-icon="hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a15.3 15.3 0 0 1-3.2 4.1M6.3 6.3A15.6 15.6 0 0 0 2 12s3.5 7 10 7c1.7 0 3.2-.5 4.4-1.2"/><path d="m3 3 18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
<p id="message" class="form-error" role="alert" aria-live="polite" hidden></p>
<button id="loginButton" class="auth-submit" type="submit"><span class="submit-label">Sign in</span></button>
</form>
</section></main>
<footer class="auth-footer"><span>© 2026 VSPH. All rights reserved.</span></footer>
</div><script defer src="/auth-background.js"></script><script defer src="/app.js"></script></body></html>
