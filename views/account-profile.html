<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your profile | VSPH</title><link rel="stylesheet" href="/operations.css"><link rel="stylesheet" href="/account-profile.css"><link rel="stylesheet" href="/project-utilities.css"><script defer src="/account-profile.js"></script></head><body><main class="account-page"><header class="utility-page-head"><h1>Your Profile</h1><nav aria-label="Account sections"><a href="/account/profile" aria-current="page">Personal details</a><a href="/account/security">Security</a></nav></header><p id="profileMessage" role="status" aria-live="polite">Loading your profile…</p><div id="profileContent" class="account-grid" hidden><aside class="account-preview"><div id="profileAvatar" class="profile-avatar" data-tone="navy" aria-hidden="true">—</div><h2 id="profilePreviewName"></h2><p id="profilePreviewBio"></p><p id="profileEmail"></p><p id="profileRole"></p><small>Your work record and access are managed separately.</small></aside><form id="profileForm"><h2>Personal Details</h2><label>Display name<input name="displayName" required maxlength="150" autocomplete="name"></label><label>About you<textarea name="bio" maxlength="500" rows="4" placeholder="A short introduction (optional)"></textarea></label><label>Time zone<input name="timeZone" required maxlength="100" list="profileZones" placeholder="Asia/Kolkata"></label><datalist id="profileZones"><option value="Asia/Kolkata"><option value="UTC"><option value="Asia/Singapore"><option value="Europe/London"><option value="America/New_York"></datalist><fieldset><legend>Avatar color</legend><label><input type="radio" name="avatarTone" value="navy" checked>Navy</label><label><input type="radio" name="avatarTone" value="blue">Blue</label><label><input type="radio" name="avatarTone" value="slate">Slate</label></fieldset><p class="account-note">Email, employment status and permissions cannot be changed here. Your avatar uses your initials; image uploads are not enabled.</p><div class="account-actions"><button type="submit" id="saveProfile">Save Profile</button><button type="button" id="reloadProfile" class="secondary">Reload Saved Details</button></div></form></div></main></body></html>
