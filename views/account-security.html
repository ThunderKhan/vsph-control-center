<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account security | VSPH Control Center</title><link rel="stylesheet" href="/operations.css"><link rel="stylesheet" href="/account-profile.css"><link rel="stylesheet" href="/project-utilities.css"><script defer src="/account-sessions.js"></script></head><body>
<main class="account-page">
<header class="utility-page-head"><div><p class="utility-eyebrow">YOUR ACCOUNT</p><h1>Security &amp; sessions</h1><p>Review portal sessions and sign out other browsers. Device identities are not collected.</p></div><nav aria-label="Account sections"><a href="/account/profile">Personal details</a><a href="/account/security" aria-current="page">Security</a></nav></header>
