<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set up employee account | VSPH</title><link rel="stylesheet" href="/invite.css"></head><body>
