<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Choose your personal password | VSPH</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/invite.css"></head><body><header><a class="brand" href="/login">VSPH<span>.</span></a><span>CONTROL CENTER</span></header><main class="invite-layout"><section class="invite-card"><p class="kicker">FIRST SIGN-IN</p><h1>Make this account yours.</h1><p id="passwordSetupInfo" class="lead">Verifying your temporary sign-in.</p><p id="passwordSetupMessage" role="status" aria-live="polite"></p><form id="passwordSetupForm" hidden><label for="personalPassword">Your new personal password</label><input id="personalPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="personalPasswordConfirm">Confirm your personal password</label><input id="personalPasswordConfirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label class="employee-enrollment-consent"><input id="personalPasswordConsent" type="checkbox" required> I accept this employee account link and will keep my personal password private.</label><p>The temporary password cannot open your workspace. Choose a different personal password; HR should never receive it.</p><button type="submit" id="savePersonalPassword">Set personal password</button></form><a class="invite-return" href="/login">Go to sign in</a><button id="cancelPasswordSetup" type="button">Cancel sign-in</button></section></main><script defer src="/employee-password.js"></script></body></html>
